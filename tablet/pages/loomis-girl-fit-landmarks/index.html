<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>loomis-girl-fit-landmarks</title>
<style>
  html, body { height: 100%; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: column; }
  #panes { flex: 1; min-height: 0; display: flex; gap: 6px; padding: 6px 6px 0; }
  .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--panel); border-radius: 8px; overflow: hidden; }
  .pane.enlarged { flex: 3; }
  .pane_header { display: flex; align-items: center; gap: 12px; padding: 3px 8px; font-size: 13px; color: var(--muted); }
  .pane_header .pane_title { flex: 1; color: var(--ink); }
  .pane_header label { display: flex; align-items: center; gap: 6px; }
  .pane_header input[type=range] { width: 90px; }
  .pane_header button { font: inherit; font-size: 12px; color: var(--ink); background: var(--panel); border: 1px solid var(--muted); border-radius: 6px; padding: 1px 10px; cursor: pointer; }
  .pane_canvases { flex: 1; min-height: 0; position: relative; }
  .pane_canvases canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; margin: 0; border-radius: 0; }
  #head_model_overlay_canvas { background: transparent; }
  #bottom_bar { padding: 6px 10px; margin: 0; }
  #bottom_bar button:disabled { opacity: 0.4; cursor: default; }
  #bottom_bar button.armed { background: #3a5a8a; border-color: var(--accent); }
  #landmark_name_field { font: inherit; font-size: 14px; width: 210px; color: var(--ink); background: var(--bg); border: 1px solid var(--muted); border-radius: 6px; padding: 2px 8px; -webkit-user-select: text; user-select: text; }
  #fit_status { font-size: 13px; color: var(--yellow); }
  #plate_missing_note { color: #e05a5a; font-size: 13px; }
</style>
</head>
<body>
<div id="panes">
  <div class="pane">
    <div class="pane_header"><span class="pane_title">plate, front</span><button class="enlarge_pane_button">bigger</button></div>
    <div class="pane_canvases"><canvas id="plate_front_canvas"></canvas></div>
  </div>
  <div class="pane">
    <div class="pane_header"><span class="pane_title">plate, profile</span><button class="enlarge_pane_button">bigger</button></div>
    <div class="pane_canvases"><canvas id="plate_profile_canvas"></canvas></div>
  </div>
  <div class="pane">
    <div class="pane_header">
      <span class="pane_title">head model</span>
      <label>skin <input type="range" id="head_model_mesh_opacity" min="0" max="1" step="0.05" value="0.5"></label>
      <button class="enlarge_pane_button">bigger</button>
    </div>
    <div class="pane_canvases"><canvas id="head_model_mesh_canvas"></canvas><canvas id="head_model_overlay_canvas"></canvas></div>
  </div>
</div>
<div id="bottom_bar" class="controls">
  <button id="add_landmark_button">add landmark</button>
  <input type="text" id="landmark_name_field" placeholder="no landmark selected" autocomplete="off">
  <button id="remove_landmark_button">remove</button>
  <button id="undo_landmark_edit_button">undo</button>
  <button id="reset_landmarks_button">reset</button>
  <label><input type="checkbox" id="landmark_names_visible"> names</label>
  <label><input type="checkbox" id="skull_visible"> skull</label>
  <label>plate <input type="range" id="plate_opacity" min="0" max="1" step="0.05" value="0.75"></label>
  <label>stiffness <input type="range" id="fit_stiffness" min="0" max="1" step="0.01" value="0"> <span id="fit_stiffness_value">0</span></label>
  <button id="recompute_fit_button">recompute fit</button>
  <span id="fit_status"></span>
  <span id="plate_missing_note" hidden>plate image missing: copy the scan into tablet/public/</span>
  <span class="hint">cross = mark read from this view, circle = guessed here. drag a mark to move it, drag elsewhere to move the picture. <a href="/pages/fit-head-to-loomis-girl/">the fit, explained</a> · <a href="/">main menu</a></span>
</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
