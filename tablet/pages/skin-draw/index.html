<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>skin-draw</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111;
                 touch-action: none; overscroll-behavior: none;
                 -webkit-user-select: none; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #toolbar { position: fixed; top: max(12px, env(safe-area-inset-top));
               right: max(12px, env(safe-area-inset-right)); display: flex; gap: 8px;
               flex-wrap: wrap; justify-content: flex-end;
               max-width: calc(100vw - 24px - env(safe-area-inset-left) - env(safe-area-inset-right)); }
    #toolbar button { padding: 10px 16px; font-size: 15px; color: #ccc;
                      background: #2a2a30; border: 1px solid #444; border-radius: 8px; }
    #toolbar button:hover, #docs_panel button:hover { color: #fff; border-color: #888; background: #3a3a42; }
    #toolbar button.armed { color: #fff; background: #3a5a8a; border-color: #6a9ad0; }
    #toolbar input[type=range] { width: 110px; align-self: center; }
    #docs_panel { position: fixed; top: max(64px, calc(env(safe-area-inset-top) + 52px));
                  right: max(12px, env(safe-area-inset-right)); display: none;
                  flex-direction: column; gap: 6px; padding: 10px;
                  background: #222228; border: 1px solid #444; border-radius: 8px; }
    #docs_panel.open { display: flex; }
    #docs_panel button { padding: 8px 14px; font-size: 15px; color: #ccc; text-align: left;
                         background: #2a2a30; border: 1px solid #444; border-radius: 6px; }
    #docs_panel button.current { color: #fff; background: #3a5a8a; border-color: #6a9ad0; }
    #toolbar button:disabled { color: #666; border-color: #333; }
    #save_status { align-self: center; font-size: 13px; color: #888; }
    #save_status.pending { color: #c9a227; }
    #save_status.saving { color: #6a9ad0; }
    #save_status.saved { color: #6c9f5a; }
    #save_status.failed, #save_status.off { color: #e05a5a; font-weight: bold; }
    #history_panel { position: fixed; top: max(64px, calc(env(safe-area-inset-top) + 52px));
                     left: max(12px, env(safe-area-inset-left)); display: none;
                     flex-direction: column; gap: 2px; padding: 10px; max-height: 60vh; overflow-y: auto;
                     background: #222228; border: 1px solid #444; border-radius: 8px;
                     font-family: monospace; }
    #history_panel.open { display: flex; }
    #history_panel button { padding: 4px 10px; font-size: 14px; color: #ccc; text-align: left;
                            white-space: pre; font-family: inherit;
                            background: transparent; border: 1px solid transparent; border-radius: 4px; }
    #history_panel button:hover { color: #fff; border-color: #888; background: #3a3a42; }
    #history_panel button.current { color: #fff; background: #3a5a8a; }
    #history_panel button.undone { color: #666; }
    #history_panel .empty { color: #666; font-size: 14px; }
    #width_panel { position: fixed; bottom: max(12px, env(safe-area-inset-bottom));
                   right: max(12px, env(safe-area-inset-right)); display: none;
                   flex-direction: column; gap: 8px; padding: 10px; color: #ccc; font-size: 14px;
                   background: #222228; border: 1px solid #444; border-radius: 8px; }
    #width_panel.open { display: flex; }
    #width_panel .controls { display: flex; flex-direction: column; gap: 8px; }
    #width_panel label { display: flex; align-items: center; gap: 8px; }
    #width_panel input[type=range] { width: 180px; }
    #width_panel input[type=number] { width: 56px; }
    #width_panel .empty { color: #666; }
    /* Layer bar: one row per layer (name = active, lock, hide); filled by sketchpad.ts. */
    #layer_bar { position: fixed; bottom: max(12px, env(safe-area-inset-bottom));
                 left: max(12px, env(safe-area-inset-left)); display: flex;
                 flex-direction: column; gap: 6px; padding: 8px;
                 background: #222228; border: 1px solid #444; border-radius: 8px; }
    #layer_bar .layer_row { display: flex; gap: 6px; }
    #layer_bar button { padding: 8px 12px; font-size: 14px; color: #ccc;
                        background: #2a2a30; border: 1px solid #444; border-radius: 6px; }
    #layer_bar .layer_row button:first-child { min-width: 64px; text-align: left; }
    #layer_bar button:hover { color: #fff; border-color: #888; background: #3a3a42; }
    #layer_bar button.armed { color: #fff; background: #3a5a8a; border-color: #6a9ad0; }
    #layer_bar button:disabled { color: #666; border-color: #333; }
    #layer_bar button.armed:disabled { color: #889; background: #2c3a52; border-color: #3a4a66; }
    #stroke_labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    #stroke_labels div { position: absolute; transform: translate(-50%, -50%);
                         padding: 2px 6px; font-size: 13px; color: #eee; white-space: nowrap;
                         background: rgba(20, 20, 26, 0.75); border-radius: 4px; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="toolbar">
    <button id="line_button" title="no vertex selected: draw free-hand; one vertex: draw from it; two (tap one, ctrl-tap the other): straight line between them">line</button>
    <button id="patch_button">patch</button>
    <button id="join_button">join</button>
    <button id="split_button">split</button>
    <button id="split_here_button" hidden title="cut the selected line at the selected pinned vertex (smooth knot)">split here</button>
    <button id="smooth_button">smooth</button>
    <button id="straighten_button" title="make the selected line(s) straight between their endpoints">straight</button>
    <button id="pin_button">pin</button>
    <button id="swing_button" title="sticky swing mode; or hold ctrl while dragging a handle">swing</button>
    <button id="midline_button" title="hold the selected vertex / line on the midline (x = 0)">mid</button>
    <button id="width_button" title="width / taper of the selected line">width</button>
    <button id="name_button">name</button>
    <button id="undo_button">undo</button>
    <button id="redo_button">redo</button>
    <button id="history_button" title="edit history: tap a row to jump to it">hist</button>
    <button id="delete_button">del</button>
    <button id="view_button">view</button>
    <button id="reference_button">ref</button>
    <button id="eyeball_button" title="show the eyeballs with the reference">eyes</button>
    <input type="range" id="reference_alpha" min="0.05" max="1" step="0.05" value="1" title="reference opacity">
    <input type="range" id="clip_offset" min="-1" max="1" step="0.01" value="1" title="sagittal clip: cuts away the far side of the plane; all the way right = off">
    <button id="surface_button">surf</button>
        <button id="docs_button">docs</button>
    <span id="save_status" title="autosave status"></span>
    <button id="pages_button" title="back to the main menu">menu</button>
  </div>
  <div id="stroke_labels"></div>
  <div id="layer_bar"></div>
  <div id="docs_panel"></div>
  <div id="history_panel"></div>
  <div id="width_panel"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
